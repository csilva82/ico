
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de Ícones ICO</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f4f6fa;color:#344054;
 font-family:Arial,sans-serif
}
header{
 background:white;padding:18px 25px;
 border-bottom:1px solid #ddd;
 font-size:20px;font-weight:bold
}
main{
 display:grid;
 grid-template-columns:220px minmax(300px,1fr) 230px;
 gap:15px;padding:18px;max-width:1450px;margin:auto
}
.panel,.editor{
 background:white;border:1px solid #ddd;
 border-radius:8px;padding:15px
}
h3{font-size:15px;margin-top:0}
.tools{
 display:grid;grid-template-columns:repeat(3,1fr);gap:6px
}
button{
 cursor:pointer;border:1px solid #ddd;
 border-radius:5px;padding:9px;background:white;
 color:#344054
}
button:hover{border-color:#493ee8;color:#493ee8}
button.active,.primary{
 background:#493ee8;color:white;border-color:#493ee8
}
.tool{font-size:20px;height:45px}
label{font-size:13px;display:block;margin:14px 0 6px}
input,select{max-width:100%}
input[type=color]{width:100%;height:35px}
input[type=range]{width:100%}
input[type=number],input[type=text],select{
 width:100%;padding:8px;border:1px solid #ccc;border-radius:4px
}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab.active{background:#493ee8;color:white}
.canvas-area{
 min-height:450px;background:#eef0ff;
 display:grid;place-items:center;padding:15px;
 overflow:auto
}
canvas#canvas{
 width:min(100%,512px);height:auto;
 aspect-ratio:1;image-rendering:pixelated;
 background:white;touch-action:none
}
.preview{
 display:grid;grid-template-columns:1fr 1fr;gap:10px;
 margin:15px 0
}
.preview div{
 text-align:center;border:1px solid #ddd;
 padding:8px;font-size:12px
}
.preview canvas{
 width:64px;height:64px;image-rendering:pixelated
}
.wide{width:100%;margin:5px 0}
.status{font-size:12px;color:#667085;margin-top:10px}
.custom{
 background:#f8f8ff;padding:10px;
 border:1px solid #ddd;border-radius:5px;margin-bottom:12px
}
@media(max-width:900px){
 main{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>⚙ Editor de Ícones ICO</header>

<main>

<!-- FERRAMENTAS -->
<aside class="panel">

<h3>Ferramentas</h3>

<div class="tools">
<button class="tool active" data-tool="pencil">✎</button>
<button class="tool" data-tool="eraser">▱</button>
<button class="tool" data-tool="text">T</button>
<button class="tool" data-tool="line">／</button>
<button class="tool" data-tool="rect">□</button>
<button class="tool" data-tool="circle">○</button>
<button class="tool" data-tool="fill">▨</button>
<button class="tool" data-tool="pick">⌖</button>
</div>

<label>Tamanho do pincel</label>
<input id="brush" type="range" min="1" max="12" value="1">

<label>Texto</label>
<input id="txt" type="text" placeholder="Digite o texto">

<label>Tamanho da fonte</label>
<input id="font" type="number" value="12" min="5" max="64">

<label>Cor</label>
<input id="color" type="color" value="#0000ff">

<label>Transparência</label>
<input id="alpha" type="range" min="0" max="100" value="100">

<label>
<input id="grid" type="checkbox" checked>
Exibir grade de pixels
</label>

<button class="wide" id="clear">Limpar desenho</button>

<button class="wide" id="undo">↶ Desfazer</button>
<button class="wide" id="redo">↷ Refazer</button>

</aside>

<!-- EDITOR CENTRAL -->
<section class="editor">

<h3>Área de edição</h3>

<div class="custom">
<label>Tamanho personalizado (1 a 256 pixels)</label>
<input id="customSize" type="number" min="1" max="256" value="128">
<button class="primary wide" id="addSize">
+ Adicionar resolução
</button>
</div>

<div class="tabs" id="tabs"></div>

<div class="canvas-area">
<canvas id="canvas" width="64" height="64"></canvas>
</div>

<p class="status" id="status">Editor pronto.</p>

</section>

<!-- EXPORTAÇÃO -->
<aside class="panel">

<h3>Pré-visualização</h3>

<div class="preview" id="preview"></div>

<button class="wide" id="refresh">
Atualizar prévia
</button>

<button class="primary wide" id="export">
Exportar arquivo ICO
</button>

<button class="wide" id="png">
Baixar PNG atual
</button>

<p class="status">
O arquivo ICO será gerado com todas as resoluções cadastradas.
</p>

</aside>

</main>

<script>
const initialSizes=[64,32,24,16];

let sizes=[...initialSizes];
let active=64;
let tool="pencil";
let drawing=false;
let start=null;
let snapshot=null;

const states={};
const undoStack={};
const redoStack={};

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function createState(size){
 const c=document.createElement("canvas");
 c.width=c.height=size;
 states[size]=c;
 undoStack[size]=[];
 redoStack[size]=[];
}

initialSizes.forEach(createState);

function current(){
 return states[active].getContext("2d");
}

function color(){
 const c=document.getElementById("color").value;
 const a=document.getElementById("alpha").value/100;

 return `rgba(
 ${parseInt(c.slice(1,3),16)},
 ${parseInt(c.slice(3,5),16)},
 ${parseInt(c.slice(5,7),16)},
 ${a})`;
}

function save(){
 const c=states[active];
 undoStack[active].push(
 current().getImageData(0,0,c.width,c.height)
 );
 if(undoStack[active].length>50)
 undoStack[active].shift();

 redoStack[active]=[];
}

function render(){
 canvas.width=canvas.height=active;
 ctx.clearRect(0,0,active,active);
 ctx.drawImage(states[active],0,0);

 if(document.getElementById("grid").checked){
  ctx.save();
  ctx.strokeStyle="rgba(100,100,120,.22)";
  ctx.lineWidth=.04;

  for(let i=1;i<active;i++){
   ctx.beginPath();
   ctx.moveTo(i,0);
   ctx.lineTo(i,active);
   ctx.stroke();

   ctx.beginPath();
   ctx.moveTo(0,i);
   ctx.lineTo(active,i);
   ctx.stroke();
  }
  ctx.restore();
 }
}

function tabs(){
 const box=document.getElementById("tabs");
 box.innerHTML="";

 sizes.forEach(s=>{
  const b=document.createElement("button");
  b.className="tab"+(s===active?" active":"");
  b.textContent=s+" × "+s;

  b.onclick=()=>{
   active=s;
   tabs();
   render();
  };

  box.appendChild(b);
 });
}

function previews(){
 const box=document.getElementById("preview");
 box.innerHTML="";

 sizes.forEach(s=>{
  const div=document.createElement("div");
  const c=document.createElement("canvas");
  c.width=c.height=s;
  c.getContext("2d").drawImage(states[s],0,0);

  const label=document.createElement("b");
  label.textContent=s+" × "+s;

  div.append(c,label);
  box.appendChild(div);
 });
}

document.getElementById("addSize").onclick=()=>{
 const s=Number(document.getElementById("customSize").value);

 if(!Number.isInteger(s)||s<1||s>256){
  alert("Informe um tamanho entre 1 e 256 pixels.");
  return;
 }

 if(states[s]){
  active=s;
  tabs();
  render();
  return;
 }

 createState(s);

 const d=current();
 d.imageSmoothingEnabled=true;
 d.drawImage(states[active===s?64:active],0,0,s,s);

 sizes.push(s);
 sizes.sort((a,b)=>b-a);
 active=s;

 tabs();
 render();
 previews();

 document.getElementById("status").textContent=
 "Resolução "+s+" × "+s+" adicionada.";
};

document.querySelectorAll(".tool").forEach(b=>{
 b.onclick=()=>{
  tool=b.dataset.tool;
  document.querySelectorAll(".tool").forEach(x=>
   x.classList.toggle("active",x===b)
  );
 };
});

function point(e){
 const r=canvas.getBoundingClientRect();

 return {
  x:Math.max(0,Math.min(active-1,
   Math.floor((e.clientX-r.left)*active/r.width))),
  y:Math.max(0,Math.min(active-1,
   Math.floor((e.clientY-r.top)*active/r.height)))
 };
}

function pixel(p,erase=false){
 const d=current();
 const n=Number(document.getElementById("brush").value);
 d.fillStyle=color();

 if(erase){
  d.clearRect(p.x,p.y,n,n);
 }else{
  d.fillRect(p.x,p.y,n,n);
 }
}

function shape(a,b){
 const d=current();
 d.strokeStyle=color();
 d.lineWidth=Number(document.getElementById("brush").value);

 d.beginPath();

 if(tool==="line"){
  d.moveTo(a.x,a.y);
  d.lineTo(b.x,b.y);
  d.stroke();
 }

 if(tool==="rect"){
  d.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);
 }

 if(tool==="circle"){
  d.ellipse(
   (a.x+b.x)/2,
   (a.y+b.y)/2,
   Math.max(.5,Math.abs(b.x-a.x)/2),
   Math.max(.5,Math.abs(b.y-a.y)/2),
   0,0,Math.PI*2
  );
  d.stroke();
 }
}

canvas.onpointerdown=e=>{
 const p=point(e);

 drawing=true;
 start=p;
 save();
 snapshot=current().getImageData(0,0,active,active);
 canvas.setPointerCapture(e.pointerId);

 if(tool==="pencil")pixel(p);
 if(tool==="eraser")pixel(p,true);

 if(tool==="text"){
  const d=current();
  d.fillStyle=color();
  d.font=document.getElementById("font").value+"px Arial";
  d.fillText(document.getElementById("txt").value||"Texto",p.x,p.y);
  drawing=false;
  render();
  previews();
 }

 if(tool==="fill"){
  flood(p.x,p.y);
  drawing=false;
  render();
  previews();
 }

 if(tool==="pick"){
  const px=current().getImageData(p.x,p.y,1,1).data;
  document.getElementById("color").value="#"+
   [...px].slice(0,3).map(v=>v.toString(16).padStart(2,"0")).join("");
  drawing=false;
 }
};

canvas.onpointermove=e=>{
 if(!drawing)return;

 const p=point(e);

 if(tool==="pencil"||tool==="eraser"){
  pixel(p,tool==="eraser");
  render();
 }else if(["line","rect","circle"].includes(tool)){
  current().putImageData(snapshot,0,0);
  shape(start,p);
  render();
 }
};

canvas.onpointerup=e=>{
 if(!drawing)return;

 const p=point(e);

 if(["line","rect","circle"].includes(tool)){
  current().putImageData(snapshot,0,0);
  shape(start,p);
 }

 drawing=false;
 render();
 previews();
};

function flood(x,y){
 const c=states[active];
 const d=current();
 const img=d.getImageData(0,0,active,active);
 const data=img.data;
 const k=(y*active+x)*4;
 const target=[...data.slice(k,k+4)];

 const hex=document.getElementById("color").value;
 const fill=[
  parseInt(hex.slice(1,3),16),
  parseInt(hex.slice(3,5),16),
  parseInt(hex.slice(5,7),16),
  Math.round(Number(document.getElementById("alpha").value)*2.55)
 ];

 const stack=[[x,y]];
 const seen=new Uint8Array(active*active);

 while(stack.length){
  const [px,py]=stack.pop();

  if(px<0||py<0||px>=active||py>=active)continue;

  const pos=py*active+px;
  if(seen[pos])continue;
  seen[pos]=1;

  const i=pos*4;

  if(data[i]!==target[0]||
     data[i+1]!==target[1]||
     data[i+2]!==target[2]||
     data[i+3]!==target[3])continue;

  data[i]=fill[0];
  data[i+1]=fill[1];
  data[i+2]=fill[2];
  data[i+3]=fill[3];

  stack.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);
 }

 d.putImageData(img,0,0);
}

document.getElementById("clear").onclick=()=>{
 save();
 current().clearRect(0,0,active,active);
 render();
 previews();
};

document.getElementById("undo").onclick=()=>{
 const stack=undoStack[active];
 if(!stack.length)return;

 redoStack[active].push(
 current().getImageData(0,0,active,active)
 );

 current().putImageData(stack.pop(),0,0);
 render();
 previews();
};

document.getElementById("redo").onclick=()=>{
 const stack=redoStack[active];
 if(!stack.length)return;

 undoStack[active].push(
 current().getImageData(0,0,active,active)
 );

 current().putImageData(stack.pop(),0,0);
 render();
 previews();
};

document.getElementById("grid").onchange=render;

function download(blob,name){
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 a.href=url;
 a.download=name;
 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(()=>URL.revokeObjectURL(url),2000);
}

document.getElementById("png").onclick=()=>{
 states[active].toBlob(blob=>
  download(blob,"icone-"+active+".png")
 );
};

document.getElementById("export").onclick=async()=>{
 try{
  const images=[];

  for(const s of sizes){
   const blob=await new Promise(resolve=>
    states[s].toBlob(resolve,"image/png")
   );

   images.push(new Uint8Array(await blob.arrayBuffer()));
  }

  const header=6;
  const entry=16;
  const offset=header+entry*sizes.length;

  const total=offset+images.reduce((n,b)=>n+b.length,0);
  const output=new Uint8Array(total);
  const view=new DataView(output.buffer);

  view.setUint16(0,0,true);
  view.setUint16(2,1,true);
  view.setUint16(4,sizes.length,true);

  let position=offset;

  images.forEach((img,i)=>{
   const p=header+i*entry;
   const s=sizes[i];

   output[p]=s===256?0:s;
   output[p+1]=s===256?0:s;

   view.setUint16(p+4,1,true);
   view.setUint16(p+6,32,true);
   view.setUint32(p+8,img.length,true);
   view.setUint32(p+12,position,true);

   output.set(img,position);
   position+=img.length;
  });

  download(
   new Blob([output],{type:"image/x-icon"}),
   "icone-personalizado.ico"
  );

  document.getElementById("status").textContent=
   "Arquivo ICO exportado com sucesso.";

 }catch(error){
  alert("Erro ao exportar: "+error.message);
 }
};

document.getElementById("refresh").onclick=previews;

tabs();
render();
previews();

</script>
</body>
</html>
